<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b12"><title>Rewards · Pixel Party</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="rewards.css"></head><body><div class="noise"></div><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">P</span>PIXEL PARTY</a><a class="points-pill" href="rewards.html">★ <span data-points>0</span> POINTS</a></header><main class="rewards-page"><a class="back" href="index.html">← BACK TO ARCADE</a><section class="rewards-hero"><div><p class="eyebrow">// PROGRESSION STORE</p><h1>PLAY. EARN.<br>UNLOCK.</h1><p>Earn points across the arcade, unlock new looks, and equip your favorites. Your balance and collection stay saved in this browser.</p></div><div class="balance-card"><span>AVAILABLE BALANCE</span><strong><span data-points>0</span> ★</strong></div></section><div class="earning-guide"><span>CHESS CAPTURE +2</span><span>CHESS WIN +25</span><span>TIC-TAC-TOE WIN +8</span><span>VEX FINISH +15</span></div><div id="reward-shop"></div></main><script src="rewards.js"></script><script>
const shop=document.querySelector('#reward-shop');
function renderShop(){const state=PixelRewards.getState(),groups=[...new Set(PixelRewards.catalog.map(item=>item.game))];shop.innerHTML=groups.map(game=>`<section class="reward-group"><h2>${game}</h2><div class="reward-grid">${PixelRewards.catalog.filter(item=>item.game===game).map(item=>{const owned=state.owned.includes(item.id),equipped=state.equipped[item.type]===item.value,canBuy=state.points>=item.cost;return `<article class="reward-card"><div><span class="game">${item.game}</span><h3>${item.name}</h3><p>${item.description}</p></div><button data-id="${item.id}" ${!owned&&!canBuy?'disabled':''} class="${equipped?'equipped':''}">${equipped?'EQUIPPED':owned?'EQUIP':item.cost+' ★'}</button></article>`}).join('')}</div></section>`).join('');shop.querySelectorAll('button[data-id]').forEach(button=>button.onclick=()=>{const id=button.dataset.id,state=PixelRewards.getState();state.owned.includes(id)?PixelRewards.equip(id):PixelRewards.purchase(id);renderShop()})}
renderShop();window.addEventListener('pixel-rewards-change',renderShop);
</script></body></html>
